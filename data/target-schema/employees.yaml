entity: employee
version: "1.0"
fields:
  employee_id:
    type: string
    required: true
    pattern: "^EMP-[A-Z0-9]+$"
    description: Canonical employee identifier
  first_name:
    type: string
    required: true
    min_length: 1
    max_length: 100
  last_name:
    type: string
    required: true
    min_length: 1
    max_length: 100
  full_name:
    type: string
    required: false
    max_length: 200
  email:
    type: email
    required: true
  phone:
    type: string
    required: false
    pattern: "^\\+?[0-9\\-\\s]{7,20}$"
  date_of_birth:
    type: date
    required: false
    format: "%Y-%m-%d"
  department:
    type: string
    required: false
  job_title:
    type: string
    required: false
  hire_date:
    type: date
    required: false
    format: "%Y-%m-%d"
  salary:
    type: number
    required: false
    description: Annual compensation
